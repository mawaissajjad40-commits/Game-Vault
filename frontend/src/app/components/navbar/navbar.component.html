<nav class="gv-nav">
  <div class="gv-nav__inner">
    <a class="gv-nav__logo" routerLink="/">
      <span class="logo-icon">◈</span>
      <span class="logo-text">Game<span class="logo-accent">Vault</span></span>
    </a>

    <ul class="gv-nav__links">
      <li><a routerLink="/games" routerLinkActive="active"><i class="bi bi-grid-3x3-gap-fill"></i> Browse</a></li>
      <li *ngIf="isLoggedIn"><a routerLink="/saved" routerLinkActive="active"><i class="bi bi-bookmark-heart-fill"></i> Collection</a></li>
    </ul>

    <div class="gv-nav__right">
      <!-- Mood Switcher -->
      <div class="mood-switcher" (click)="toggleMood($event)" [class.open]="moodOpen">
        <span class="mood-current">{{ currentMood.label }}</span>
        <i class="bi bi-chevron-down mood-chevron"></i>
        <div class="mood-dropdown" *ngIf="moodOpen">
          <button *ngFor="let mood of moods"
            class="mood-option"
            [class.active]="currentMood.id === mood.id"
            (click)="setMood(mood, $event)">
            {{ mood.label }}
          </button>
        </div>
      </div>

      <ng-container *ngIf="!isLoggedIn">
        <a routerLink="/login" class="btn-ghost">Login</a>
        <a routerLink="/register" class="btn-accent">Join Free</a>
      </ng-container>

      <ng-container *ngIf="isLoggedIn">
        <div class="user-menu" (click)="toggleUserMenu($event)" [class.open]="menuOpen">
          <div class="user-avatar">{{ currentUser?.username?.charAt(0)?.toUpperCase() }}</div>
          <span class="user-name">{{ currentUser?.username }}</span>
          <i class="bi bi-chevron-down chevron"></i>
          <div class="dropdown-panel" *ngIf="menuOpen">
            <a routerLink="/profile" (click)="menuOpen=false"><i class="bi bi-person-circle"></i> Profile</a>
            <a routerLink="/saved" (click)="menuOpen=false"><i class="bi bi-bookmark-heart-fill"></i> My Collection</a>
            <hr>
            <a (click)="logout()" class="logout-link"><i class="bi bi-box-arrow-right"></i> Logout</a>
          </div>
        </div>
      </ng-container>
    </div>
  </div>
</nav>
